SourceFiles: ["./embedded_c.c"]

Defines: ["NO_SSL=1"]

Dependencies:
-   Name: civetweb
    Platforms: [DefaultPlatform]
    Source:
        Git:
            URL: "https://github.com/civetweb/civetweb.git"
            Branch: v1.16
    LibraryType: Static
    IncludePaths: ["include"]
    LinkProperties:
        SearchLibraryNames: ["civetweb"]
        SearchDirectories: ["./output/src", "./output/src/Debug"]
    Setup:
    -   "mkdir output"
    -   "cd output && cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCIVETWEB_BUILD_TESTING=OFF -DCIVETWEB_ENABLE_ASAN=OFF"
    -   "cd output && cmake --build . -j 8"
