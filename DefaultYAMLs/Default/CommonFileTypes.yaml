# DO NOT modify this file. Changes will be overwritten when there's a reset or update

# TODO: Make this arrays?...
FilesTypes:
    # The file properties for the files to be **linked** as object file for each platform
    ObjectLinkFile:
        Prefix:
            DefaultPlatform: ""
        Extension:
            Windows: ".obj"
            Unix: ".o"
    # The file properties for the files to be **linked** as shared libraries for each platform
    SharedLinkFile:
        Prefix:
            DefaultPlatform: ""
            Linux: "lib"
            MacOS: "lib"
        Extension:
            Windows: ".lib"
            Linux: ".so"
            MacOS: ".dylib"
    # The file properties for the files to be **copied** as shared libraries for each platform
    SharedLibraryFile:
        Prefix:
            DefaultPlatform: ""
            Linux: "lib"
        Extension:
            Windows: ".dll"
            Linux: ".so"
            MacOS: ".dylib"
    # The file properties for the files to be linked as static libraries for each platform
    StaticLinkFile:
        Prefix:
            DefaultPlatform: ""
            Unix: "lib"
        Extension:
            Windows: ".lib"
            Unix: ".a"
    # The file properties for the files to be **copied** as executable for each platform
    ExecutableFile:
        Prefix:
            DefaultPlatform: ""
        Extension:
            DefaultPlatform: ""
            Windows: ".exe"
    # (Optional) The file properties for debug symbols to be copied alongside the binary 
    #            for each platform
    DebugSymbolFile:
        Prefix:
            Windows: ""
        Extension:
            Windows: ".pdb"
