# DO NOT modify this file. Changes will be overwritten when there's a reset or update

# Name (case sensitive) of the profile that can be queried from a script
Name: "g++"

# (Optional) Name aliases (case sensitive) of the current profile
NameAliases: ["mingw"]

# The file extensions associated with the profile
FileExtensions: [.cpp, .cc, .cxx]

# The languages supported by the profile
Languages: ["c++"]

# (Optional) The commands to run in **shell** before calling the compiler/linker for each platform.
#            This is run inside the root build directory.
# Setup: 
#     DefaultPlatform: []

# (Optional) The commands to run in **shell** after calling the compiler/linker for each platform.
#            This is run inside the root build directory.
# Cleanup: 
#     DefaultPlatform: []

# The file properties for the object files for each platform. 
# See "./CommonFileTypes.yaml" for FilesTypes
# FilesTypes: ...

# (Optional) We can use the "Import" field to import other yaml files. We are importing "FilesTypes" here.
#            Import can either be a single path or a list of paths. 
#            All the fields in the imported yaml files will be merged together
Import: "./CommonFileTypes.yaml"

# Compiler settings, run once per input file
Compiler:
    # (Optional) The command to be prepend for each compile command in **shell** for each platform
    # PreRun: 
    #     DefaultPlatform: ""
    
    # Shell command to use for checking if the executable exists or not
    CheckExistence: 
        DefaultPlatform: "g++ -v"
    
    # Here are a list of substitution strings for RunParts, Setup and Cleanup. 
    # To escape '{' and '}' to avoid substitutioon, simply repeat the '{' or '}' character again.
    # So "${MyBashVariable}" will become "${{MyBashVariable}}"

    # Constants: --------------------------------------------------------------------------------------
    # {Stage.SharedLibraryFile.Prefix}
    # {Stage.SharedLinkFile.Prefix}
    # {Stage.StaticLinkFile.Prefix}
    # {Stage.ObjectLinkFile.Prefix}
    # {Stage.DebugSymbolFile.Prefix}
    # {Stage.SharedLibraryFile.Extension}
    # {Stage.SharedLinkFile.Extension}
    # {Stage.StaticLinkFile.Extension}
    # {Stage.ObjectLinkFile.Extension}
    # {Stage.DebugSymbolFile.Extension}
    # {/}:                                  Filesystem separator for the host platform
    
    
    # Stage Info: --------------------------------------------------------------------------------------
    # {Stage.Executable}:                   Compiler executable
    # {Stage.CompileFlags}:                 Compile flags from config and override
    
    
    # Input/Output Info: --------------------------------------------------------------------------------------
    # {Stage.Input.Name}:                   Name of the current input source file (without directory path and extension)
    # {Stage.Input.Extension}:              Extension of the current input source file
    # {Stage.Input.Directory}:              Directory of the current input source file
    # {Stage.Input.Path}:                   Full path to the current input source file
    # {Stage.Output.Directory}:              Directory of all the output files
    
    
    # Iterable variables, must be inside "Repeats" run type: --------------------------------------------------------------------------------------
    # {Stage.DefineNameOnly}:               All the defines without a value specified (equivalent to #define X)
    # {Stage.DefineName}:                   Name of all the defines that has a value specified
    # {Stage.DefineValue}:                  Value of all the defines that has a value specified (use together with {Stage.DefineName})
    
    # {Stage.IncludeDirectory.Path}:         Path to all the include directories
    CompileTypes:
        Executable:
            DefaultPlatform:
                # Default flags to be substituted as {Stage.CompileFlags}
                Flags: "-std=c++17 -Wall -g"
                
                # The executable to be substituted as {Stage.Executable}
                Executable: "g++"
                
                # The components for the command to be run
                RunParts: &g++_CompileRunParts
                -   Type: Once
                    CommandPart: "{Stage.Executable} -c {Stage.CompileFlags}"
                -   Type: Repeats
                    CommandPart: " -D{Stage.DefineNameOnly}="
                -   Type: Repeats
                    CommandPart: " \"-D{Stage.DefineName}={Stage.DefineValue}\""
                -   Type: Repeats
                    CommandPart: " -I\"{Stage.IncludeDirectory.Path}\""
                -   Type: Once
                    CommandPart: " \"{Stage.Input.Path}\" -o \"{Stage.Output.Directory}{/}{Stage.ObjectLinkFile.Prefix}{Stage.Input.Name}{Stage.ObjectLinkFile.Extension}\""
                
                # What files to be expected as output for the command
                ExpectedOutputFiles: &g++_CompileExpectedOutputFiles
                -   "{Stage.Output.Directory}{/}{Stage.ObjectLinkFile.Prefix}{Stage.Input.Name}{Stage.ObjectLinkFile.Extension}"
                
                # (Optional) The commands to run in **shell** BEFORE compiling
                #            This is run inside the .runcpp2 directory where the build happens.
                # Setup: []
                
                # (Optional) The commands to run in **shell** AFTER compiling
                #            This is run inside the .runcpp2 directory where the build happens.
                # Cleanup: []
        ExecutableShared:
            DefaultPlatform:
                Flags: "-std=c++17 -Wall -g -fpic"
                Executable: "g++"
                RunParts: *g++_CompileRunParts
                ExpectedOutputFiles: *g++_CompileExpectedOutputFiles
                # Setup: []
                # Cleanup: []
        Static:
            DefaultPlatform:
                Flags: "-std=c++17 -Wall -g"
                Executable: "g++"
                RunParts: *g++_CompileRunParts
                ExpectedOutputFiles: *g++_CompileExpectedOutputFiles
                # Setup: []
                # Cleanup: []
        Shared:
            DefaultPlatform:
                Flags: "-std=c++17 -Wall -g -fpic"
                Executable: "g++"
                RunParts: *g++_CompileRunParts
                ExpectedOutputFiles: *g++_CompileExpectedOutputFiles
                # Setup: []
                # Cleanup: []

# Linker settings, run once
Linker:
    CheckExistence:
        DefaultPlatform: "g++ -v"
    
    # Here are a list of substitution strings for RunParts, Setup and Cleanup
    
    # Constants: --------------------------------------------------------------------------------------
    # {Stage.SharedLibraryFile.Prefix}
    # {Stage.SharedLinkFile.Prefix}
    # {Stage.StaticLinkFile.Prefix}
    # {Stage.ObjectLinkFile.Prefix}
    # {Stage.DebugSymbolFile.Prefix}
    # {Stage.SharedLibraryFile.Extension}
    # {Stage.SharedLinkFile.Extension}
    # {Stage.StaticLinkFile.Extension}
    # {Stage.ObjectLinkFile.Extension}
    # {Stage.DebugSymbolFile.Extension}
    # {/}:                                  Filesystem separator for the host platform
    
    
    # Stage Info: --------------------------------------------------------------------------------------
    # {Stage.Executable}:                   Linker executable
    # {Stage.LinkFlags}:                    Link flags from config and override
    
    
    # Output Info: --------------------------------------------------------------------------------------
    # {Stage.Output.Name}:                  Name of all the output files (without directory path and extension)
    # {Stage.Output.Directory}:             Directory of all the output files
    
    
    # Iterable variables, must be inside "Repeats" run type: --------------------------------------------------------------------------------------
    # {Stage.Input.Name}:                   Name of the file to be linked, regardless of the build type
    # {Stage.Input.Extension}:              File Extension of the file to be linked, regardless of the build type
    # {Stage.Input.Directory}:              Directory of the file to be linked, regardless of the build type
    # {Stage.Input.Path}:                   Full path to the file to be linked, regardless of the build type
    
    # {Stage.Input.Object.Name}:           Name of the object file to be linked
    # {Stage.Input.Object.Extension}:      File Extension of the object file to be linked
    # {Stage.Input.Object.Directory}:      Directory of the object file to be linked
    # {Stage.Input.Object.Path}:           Full path to the object file to be linked
    
    # {Stage.Input.Shared.Name}:           Name of the shared file to be linked
    # {Stage.Input.Shared.Extension}:      File Extension of the shared file to be linked
    # {Stage.Input.Shared.Directory}:      Directory of the shared file to be linked
    # {Stage.Input.Shared.Path}:           Full path to the shared file to be linked
    
    # {Stage.Input.Static.Name}:           Name of the static file to be linked
    # {Stage.Input.Static.Extension}:      File Extension of the static file to be linked
    # {Stage.Input.Static.Directory}:      Directory of the static file to be linked
    # {Stage.Input.Static.Path}:           Full path to the static file to be linked
    LinkTypes:
        Executable:
            Unix:
                Flags: "-Wl,-rpath,\\$ORIGIN"
                Executable: "g++"
                RunParts:
                -   Type: Once
                    CommandPart: "{Stage.Executable} {Stage.LinkFlags} -o \"{Stage.Output.Directory}{/}{Stage.Output.Name}\""
                -   Type: Repeats
                    CommandPart: " \"{Stage.Input.Path}\""
                ExpectedOutputFiles: ["{Stage.Output.Directory}{/}{Stage.Output.Name}"]
                # Setup: []
                # Cleanup: []
            Windows:
                Flags: "-Wl,-rpath,\\$ORIGIN"
                Executable: "g++"
                RunParts:
                -   Type: Once
                    CommandPart: "{Stage.Executable} {Stage.LinkFlags} -o \"{Stage.Output.Directory}{/}{Stage.Output.Name}.exe\""
                -   Type: Repeats
                    CommandPart: " \"{Stage.Input.Path}\""
                ExpectedOutputFiles: ["{Stage.Output.Directory}{/}{Stage.Output.Name}.exe"]
                # Setup: []
                # Cleanup: []
        ExecutableShared:
            DefaultPlatform:
                Flags: "-shared -Wl,-rpath,\\$ORIGIN"
                Executable: "g++"
                RunParts:
                -   Type: Once
                    CommandPart: "{Stage.Executable} {Stage.LinkFlags} -o \"{Stage.Output.Directory}{/}{Stage.SharedLibraryFile.Prefix}{Stage.Output.Name}{Stage.SharedLibraryFile.Extension}\""
                -   Type: Repeats
                    CommandPart: " \"{Stage.Input.Path}\""
                ExpectedOutputFiles: ["{Stage.Output.Directory}{/}{Stage.SharedLibraryFile.Prefix}{Stage.Output.Name}{Stage.SharedLibraryFile.Extension}"]
                # Setup: []
                # Cleanup: []
        Static:
            DefaultPlatform:
                Flags: ""
                Executable: "g++"
                RunParts:
                -   Type: Once
                    CommandPart: "{Stage.Executable} {Stage.LinkFlags} -o \"{Stage.Output.Directory}{/}{Stage.StaticLinkFile.Prefix}{Stage.Output.Name}{Stage.StaticLinkFile.Extension}\""
                -   Type: Repeats
                    CommandPart: " \"{Stage.Input.Path}\""
                ExpectedOutputFiles: ["{Stage.Output.Directory}{/}{Stage.StaticLinkFile.Prefix}{Stage.Output.Name}{Stage.StaticLinkFile.Extension}"]
                # Setup: []
                # Cleanup: []
        Shared:
            DefaultPlatform:
                Flags: "-shared -Wl,-rpath,\\$ORIGIN"
                Executable: "g++"
                RunParts:
                -   Type: Once
                    CommandPart: "{Stage.Executable} {Stage.LinkFlags} -o \"{Stage.Output.Directory}{/}{Stage.SharedLibraryFile.Prefix}{Stage.Output.Name}{Stage.SharedLibraryFile.Extension}\""
                -   Type: Repeats
                    CommandPart: " \"{Stage.Input.Path}\""
                ExpectedOutputFiles: ["{Stage.Output.Directory}{/}{Stage.SharedLibraryFile.Prefix}{Stage.Output.Name}{Stage.SharedLibraryFile.Extension}"]
                # Setup: []
                # Cleanup: []
