# DO NOT modify this file. Changes will be overwritten when there's a reset or update

# https://learn.microsoft.com/en-us/cpp/overview/compiler-versions?view=msvc-170
Name: "vs2022_v17+"
NameAliases: ["msvc1930+", "msvc"]
FileExtensions: [.cpp, .cc, .cxx, .c]
Languages: ["c", "c++"]
Import: "./CommonFileTypes.yaml"
Parameters:
    Profile.CompileMode:
        Default: "Debug"
        Constraint:
        -   "Debug:/nologo /W4 /diagnostics:caret /utf-8 /MDd /EHar /std:c++17 /RTC1 \
            /Zc:inline /Zi /permissive- /external:W0"
        -   "Release:/nologo /W4 /diagnostics:caret /utf-8 /MD /EHar /std:c++17 \
            /Zc:inline /permissive- /external:W0 /O2 /DNDEBUG=1"
    Profile.LinkMode:
        Default: "Debug"
        Constraint:
        -   "Debug: /DEBUG"
        -   "Release:"
    
    Profile.OutputPreprocess:
        Default: "false"
        Constraint:
        -   "true: /P"
        -   "1: /P"
        -   "false:"
        -   "0:"
Variables:
    Profile.Intern_CompileFlags: "{Profile.CompileMode}{Profile.OutputPreprocess}"
    Profile.Intern_LinkFlags: "/NOLOGO kernel32.lib user32.lib gdi32.lib winspool.lib shell32.lib \
        ole32.lib oleaut32.lib uuid.lib comdlg32.lib advapi32.lib /manifest:embed /SUBSYSTEM:CONSOLE \
        /MANIFESTUAC:\"level='asInvoker'\"{Profile.LinkMode}"
Setup: 
    Windows:
    -   >-
        for /f "usebackq tokens=*" %i in (`CALL "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" 
        -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do ( 
        echo "%i\VC\Auxiliary\Build\vcvarsall.bat" x64 > .\prerun.bat
        )
Cleanup: 
    Windows: [ "del .\\prerun.bat" ]
Compiler:
    PreRun: 
        Windows: ".\\prerun.bat"
    CheckExistence: 
        Windows: "where.exe CL.exe"
    CompileTypes:
        Executable:
            Windows:
                Flags: "{Profile.Intern_CompileFlags}"
                Executable: "CL.exe"
                RunParts: &vs2022_v17+_CompileRunParts
                -   Type: Once
                    CommandPart: "{Stage.Executable} /c {Stage.CompileFlags}"
                -   Type: Repeats
                    CommandPart: " /D{Stage.DefineNameOnly}="
                -   Type: Repeats
                    CommandPart: " \"/D{Stage.DefineName}={Stage.DefineValue}\""
                -   Type: Repeats
                    CommandPart: " /external:I\"{Stage.IncludeDirectory.Dep.Path}\""
                -   Type: Repeats
                    CommandPart: " /I\"{Stage.IncludeDirectory.Source.Path}\""
                -   Type: Once
                    CommandPart: " /Fo\"{Stage.Output.Directory}{/}{Stage.ObjectLinkFile.Prefix}\
                        {Stage.Input.Name}{Stage.ObjectLinkFile.Extension}\" \
                        /Fd\"{Stage.Output.Directory}{/}{Stage.DebugSymbolFile.Prefix}\
                        {Stage.Input.Name}{Stage.DebugSymbolFile.Extension}\" \"{Stage.Input.Path}\""
                ExpectedOutputFiles: &vs2022_v17+_CompileExpectedOutputFiles
                -   "{Stage.Output.Directory}{/}{Stage.ObjectLinkFile.Prefix}{Stage.Input.Name}\
                    {Stage.ObjectLinkFile.Extension}"
                -   "{Stage.Output.Directory}{/}{Stage.DebugSymbolFile.Prefix}{Stage.Input.Name}\
                    {Stage.DebugSymbolFile.Extension}"
        Static:
            Windows:
                Flags: "{Profile.Intern_CompileFlags}"
                Executable: "CL.exe"
                RunParts: *vs2022_v17+_CompileRunParts
                ExpectedOutputFiles: *vs2022_v17+_CompileExpectedOutputFiles
        Shared:
            Windows:
                Flags: "{Profile.Intern_CompileFlags}"
                Executable: "CL.exe"
                RunParts: *vs2022_v17+_CompileRunParts
                ExpectedOutputFiles: *vs2022_v17+_CompileExpectedOutputFiles
Linker:
    PreRun: 
        Windows: ".\\prerun.bat"
    CheckExistence:
        Windows: "where.exe link.exe"
    LinkTypes:
        Executable:
            Windows:
                Flags: "{Profile.Intern_LinkFlags}"
                Executable: "link.exe"
                RunParts:
                -   Type: Once
                    CommandPart: "{Stage.Executable} {Stage.LinkFlags} \
                        /OUT:\"{Stage.Output.Directory}{/}{Stage.Output.Name}\
                        {Stage.ExecutableFile.Extension}\""
                -   Type: Repeats
                    CommandPart: " \"{Stage.Input.Path}\""
                ExpectedOutputFiles: 
                -   "{Stage.Output.Directory}{/}{Stage.Output.Name}{Stage.ExecutableFile.Extension}"
        Static:
            Windows:
                Flags: "/NOLOGO"
                Executable: "lib.exe"
                RunParts:
                -   Type: Once
                    CommandPart: "{Stage.Executable} {Stage.LinkFlags} \
                        /OUT:\"{Stage.Output.Directory}{/}{Stage.StaticLinkFile.Prefix}\
                        {Stage.Output.Name}{Stage.StaticLinkFile.Extension}\" \
                        /IMPLIB:\"{Stage.Output.Directory}{/}{Stage.SharedLinkFile.Prefix}\
                        {Stage.Output.Name}{Stage.SharedLinkFile.Extension}\""
                -   Type: Repeats
                    CommandPart: " \"{Stage.Input.Path}\""
                ExpectedOutputFiles: 
                -   "{Stage.Output.Directory}{/}{Stage.StaticLinkFile.Prefix}{Stage.Output.Name}\
                    {Stage.StaticLinkFile.Extension}"
        Shared:
            Windows:
                Flags: "{Profile.Intern_LinkFlags} /DLL"
                Executable: "link.exe"
                RunParts:
                -   Type: Once
                    CommandPart: "{Stage.Executable} {Stage.LinkFlags} \
                        /OUT:\"{Stage.Output.Directory}{/}{Stage.SharedLibraryFile.Prefix}\
                        {Stage.Output.Name}{Stage.SharedLibraryFile.Extension}\" \
                        /IMPLIB:\"{Stage.Output.Directory}{/}{Stage.SharedLinkFile.Prefix}\
                        {Stage.Output.Name}{Stage.SharedLinkFile.Extension}\""
                -   Type: Repeats
                    CommandPart: " \"{Stage.Input.Path}\""
                ExpectedOutputFiles: 
                -   "{Stage.Output.Directory}{/}{Stage.SharedLibraryFile.Prefix}{Stage.Output.Name}\
                    {Stage.SharedLibraryFile.Extension}"
